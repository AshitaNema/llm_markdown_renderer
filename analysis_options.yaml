include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat the API-hygiene rules below as build failures, not hints.
    public_member_api_docs: error
    missing_return: error
  exclude:
    - build/**
    # The example is a separate app with its own pubspec and its own
    # analysis_options.yaml; CI analyzes it from inside example/.
    - example/**

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - avoid_catches_without_on_clauses
    - avoid_dynamic_calls
    - avoid_print
    - avoid_returning_this
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - combinators_ordering
    - directives_ordering
    - discarded_futures
    - eol_at_end_of_file
    - no_adjacent_strings_in_list
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_if_null_operators
    - prefer_null_aware_method_calls
    - public_member_api_docs
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_null_aware_operator_on_extension_on_nullable
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_if_null_to_convert_nulls_to_bools
    - use_named_constants
    - use_super_parameters
    - use_test_throws_matchers
