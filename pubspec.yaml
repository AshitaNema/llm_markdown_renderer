name: llm_markdown_renderer
description: >-
  Renders Markdown streamed token by token from an LLM without jank. Incremental
  parsing, stable partial code fences, tables and lists, syntax highlighting.
version: 0.2.2
homepage: https://ashitanema.github.io/llm_markdown_renderer/
repository: https://github.com/AshitaNema/llm_markdown_renderer
issue_tracker: https://github.com/AshitaNema/llm_markdown_renderer/issues
screenshots:
  - description: Markdown streaming in token by token, with code and tables
    path: screenshots/demo.gif
topics:
  - markdown
  - llm
  - streaming
  - ai
  - syntax-highlighting

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
